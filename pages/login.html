<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Membre - TradeLife</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/pack-favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/pack-favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/pack-favicon/apple-touch-icon.png">
    
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-body">

<!-- Header Minimaliste -->
<header class="navbar-pill">
    <a href="../index.html" class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
        TRADELIFE
    </a>
    <nav class="nav-menu">
        <div class="nav-slider"></div>
        <a href="../index.html" class="btn-header-cta">Revenir à l'accueil</a>
    </nav>
</header>

<!-- Carte de connexion centrée -->
<main class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>Bon retour parmi nous</h2>
            <p>Connectez-vous pour accéder à votre dashboard</p>
        </div>
        
        <form id="login-form" class="auth-form" onsubmit="event.preventDefault();">
            <div class="input-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" placeholder="exemple@mail.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div class="login-options">
                <label class="remember-me">
                    <input type="checkbox"> Se souvenir de moi
                </label>
                <a href="#" class="forgot-pwd">Mot de passe oublié ?</a>
            </div>
            
            <!-- Réutilisation de ton bouton moderne -->
            <button type="submit" class="btn-meta-submit">Se connecter</button>
        </form>
        
        <div class="login-footer">
            <p>Pas encore membre ? <a href="../index.html#formations">Découvrir nos packs</a></p>
        </div>
    </div>
</main>

<script src="../assets/js/main.js"></script>
</body>
</html>
