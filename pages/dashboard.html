<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Membre – TradeLife</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- SDK Supabase (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="navbar">
    <div class="logo">TradeLife – Espace Membre</div>
    <nav>
        <span id="user-email" style="color: #00ff44; font-size: 0.9rem; margin-right: 15px;"></span>
        <button id="btn-logout" class="btn-nav" style="border: none; cursor: pointer;">Déconnexion</button>
    </nav>
</header>

<main class="section" style="padding-top: 120px;">
    <h2>Vos Formations</h2>
    <p style="color: #aaa; margin-top: 10px;">Accédez au contenu débloqué suite à votre inscription.</p>

    <div class="cards" style="margin-top: 40px;">
        <div class="card">
            <h3>Module Débutant</h3>
            <p>Les fondamentaux et l'analyse technique de base.</p>
            <span class="price" style="color: #00ff44;">Accès Actif</span>
            <button onclick="alert('Lancement de la vidéo...')">Visionner</button>
        </div>
        <div class="card">
            <h3>Module Intermédiaire</h3>
            <p>Gestion du risque et psychologie de marché.</p>
            <span class="price" style="color: #888;">Verrouillé</span>
            <button style="background: #333; color: #888; cursor: not-allowed;" disabled>Verrouillé</button>
        </div>
    </div>
</main>

<script src="../assets/js/auth.js"></script>
</body>
</html>
