<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Dashboard - TradeLife</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="dashboard-body">

    <div class="dashboard-layout">
        <!-- Menu latéral -->
        <aside class="sidebar">
            <div class="sidebar-logo">TRADE<span>LIFE</span></div>
            <nav class="sidebar-nav">
                <a href="#" class="active">Vue d'ensemble</a>
                <a href="#">Mes Formations</a>
                <a href="#">Journal de Trading</a>
                <a href="#">Outils & Calculateurs</a>
                <a href="#">Communauté VIP</a>
            </nav>
            <!-- Ce bouton servira pour tester la déconnexion Supabase -->
            <a href="../index.html" class="logout-btn" id="btn-logout">Déconnexion</a>
        </aside>

        <!-- Contenu principal -->
        <main class="dashboard-main">
            <header class="dashboard-header">
                <h1>Vue d'ensemble</h1>
                <!-- Cet élément affichera l'email de l'utilisateur connecté via JS -->
                <div class="user-profile-badge" id="user-display">Utilisateur Test</div>
            </header>

            <div class="dashboard-grid">
                <div class="dash-card-placeholder">
                    [ Zone 1 : Vidéo en cours de lecture ]
                </div>
                <div class="dash-card-placeholder">
                    [ Zone 2 : Accès rapide Telegram ]
                </div>
                <div class="dash-card-placeholder">
                    [ Zone 3 : Calculateur de risque ]
                </div>
            </div>
        </main>
    </div>

</body>
</html>
